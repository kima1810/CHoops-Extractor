Version: 1.2

# College Hoops 2K8 (BLUS30078) - RPCS3 game patches by Claude Code.
# Keyed to the 2026-27 year-patched EBOOT (V4.2 base build); enable entries in
# Manage > Game Patches. Groups: 60 FPS, poll rank on the scorebug / Team Select /
# pregame matchup card, recruit generation (heights, skilled bigs, international),
# Legacy transfers (frequency, unhappiness, no sit-out), Quick Game team cycling in
# conference member order, and a 30-second shot clock.

PPU-cd3a6cffbf5c1930053d0873658d0f3c46e19c8b:
  "60 FPS (all screens)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "The vblank handler flips every N vblanks (ctx+0x3CE4). The game sets N to the largest interval requested by its systems (function 0x6FC58): 1 in menus, 2 (30 fps) in gameplay. This forces N = 1. Frame time scales with N x vblank period or uses real time, so game speed stays correct. Set Vblank Rate back to 60 in this game's custom config; keep Frame limit 60. Needs a PC that holds 60 fps in RPCS3."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x0006FCA4, 0x38600001 ] # mr r3,r8 (largest requested interval) -> li r3,1

  "Scorebug: team names (home_city / away_city)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "The scorebug's home_city/away_city text providers (0x4EF9A4 / 0x4EFABC) ask a mode check (0x4EED80) and, in a normal game, skip the existing formatter 0x4EF92C that writes the team's name string (team +4). These two edits let the formatter run. Only visible with a scorebug layout that draws the home_city/away_city text nodes. Do not enable together with the poll-rank scorebug entry, which already includes this fix."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x004EF9F0, 0x60000000 ] # home: bne cr7 (skip name formatter) -> nop
      - [ be32, 0x004EFB08, 0x60000000 ] # away: bne cr7 (skip name formatter) -> nop

  "Scorebug: team names with poll rank (#5 DUKE)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "Rewrites the scorebug home/away text providers (0x4EF9A4 / 0x4EFABC) in place. Scorebug team objects (0x57F050 / 0x57F064) are per-game copies of the roster team record, so each is matched to the current media poll (0x5BDB44, slots 0-24) by its unique team ID (anchor +0x15E); ID 0 is never matched. Ranked text uses the game's own formatter (0x49E0E4) and English templates 0x12BE2A9D '#{0}' (rank) and 0xDB12E271 '{0} {1}' (rank text + team name), written straight into the slot like native providers. Unranked teams show the name only. Includes the team-name fix: do NOT enable together with 'Scorebug: team names'. Drops the provider's game-mode-4 special text."
    Patch Version: 1.2
