  "Recruits: Taller centers (6'9\" - 7'4\")":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "Recruit generator 0x7599EC sets height = min + (max - min) x bucket / 11 (bell-shaped bucket) from per-position float tables read only there: min at 0x10034110, max at 0x100340FC (PG,SG,SF,PF,C). Stock center range 78-86 in (6'6\" - 7'2\"); this sets 81-88 in. Height is stored in 7 bits, so no truncation. Applies to recruits generated while enabled. Enable at most one Recruits height entry."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x10034120, 0x42A20000 ] # center min height 78.0 -> 81.0
      - [ be32, 0x1003410C, 0x42B00000 ] # center max height 86.0 -> 88.0

