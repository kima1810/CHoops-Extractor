  "Shot clock: 30 seconds (was 35)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "The shot clock reset value is the float 35.0 at library TOC +0x6714 (0xA5B1DC), read only by the shot-clock reset code (0x3C80B4, 0x3C8568, 0x3C8580), which stores it as the live, reset and maximum shot clock (game state +0x280/+0x284/+0x288). This sets it to 30.0. Other shot-clock modes (40 s, off) and other resets (e.g. 8 s) are unchanged."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x00A5B1DC, 0x41F00000 ] # 35.0 -> 30.0
  "NCAA Tournament: 68 teams with a four-game First Four (Stage 1)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "Code caves (RPCS3 calloc). Selection (0x5C1D30, and the projection screen 0x5BFCDC) makes the four lowest automatic bids play-in teams; the NIT fill (0x5C2124) leaves out the three best teams outside the field, who join the last at-large team in the at-large games. The bracket builder (0x590084) is replaced: event 90 (two lowest autos, Tuesday) feeds East 16, and the finished 2K Sports Classic first-round events 2, 3 and 4 become South 16 (autos, Tuesday), Midwest 11 and West 11 (at-large, Wednesday) through link-table rows 0-2 (restored when events 2-4 are next built or finished as holiday events: 0x58F848, 0x58F310). While they hold a play-in game, events 2-4 read the event 90 record (name, schedule config) at 0x58C270, 0x58F234, 0x58F600, 0x58F700 and 0x58F8A4. NCAA appearances (0x5C19E0) come from the built bracket, so all 68 teams are credited, play-in teams with the seed of the slot their game feeds. If the field does not have four play-in teams the stock builder runs. Enable before Selection Sunday of a new season. The tournament bracket screen still shows only the event 90 play-in game."
    Patch Version: 1.2
    Patch:
      - [ calloc, 0x005c1d30, 19 ] # four lowest autos to play-in
      - [ be32, 0x005c1d30, 0xc002cbd8 ]
