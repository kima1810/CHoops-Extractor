  "NCAA Tournament: First Four on the Tournament Tree (Stage 2)":
    Games:
      "College Hoops 2K8":
        BLUS30078: [ All ]
    Author: "Claude Code"
    Notes: "Needs the Stage 1 entry. The tree's NCAA pages already include First Four events 2-4 (before the stock play-in, event 90). The NCAA tree's play-in box (0x65A548) shows the open First Four page's game; on a First Four page LT/RT step from the page (0x65FD60, 0x65FE98) and on arrival the bracket is redrawn for the page and the cursor put on the play-in box (0x65A264), so all four play-in pages can be reached. These caves also extend the screen's event 90 special cases: no seeds on the play-in pages (0x65DC28, 0x65DCA0), and 'PLAY-IN GAME WINNER' (text 0x65DF24, Legacy TBD paths 0x65DE88 and 0x65DEE0, box style 0x65E7F4) in every regional first-round slot a First Four game feeds (East 16, South 16, Midwest 11, West 11) instead of only East 1-16."
